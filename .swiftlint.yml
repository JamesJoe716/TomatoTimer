# SwiftLint configuration for TomatoTimer.
#
# Philosophy: the linter is a guardrail, not a style tribunal. Rules that fight
# idiomatic SwiftUI (deeply nested view builders, trailing closures, short
# geometry identifiers) are turned off rather than suppressed at each call site.
#
# Run locally with `Scripts/lint.sh` or the whole gate with `Scripts/ci.sh`.

included:
  - TomatoTimer
  - TomatoTimerTests
  - TomatoTimerWidget

excluded:
  - build
  - DerivedData
  - .build
  - TomatoTimer/Assets.xcassets

# --- Rules we deliberately switch off -----------------------------------------
disabled_rules:
  # SwiftUI `body` properties are legitimately long and deeply nested; these
  # three fire constantly on view code without pointing at a real problem.
  - type_body_length
  - function_body_length
  - cyclomatic_complexity
  # Trailing closures read worse than named arguments in several SwiftUI
  # modifiers (e.g. `animation(_:value:)` style call sites).
  - multiple_closures_with_trailing_closure
  # `TODO:`/`FIXME:` markers are tracked in WORKLOG.md, not by the linter.
  - todo
  # `FocusDayStat.count` is a Codable session tally, not a collection, so
  # `empty_count` only ever fires as a false positive here. Renaming the
  # property would change the persisted JSON key for no real benefit.
  - empty_count

# --- Opt-in rules worth having ------------------------------------------------
opt_in_rules:
  - array_init
  - closure_body_length
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_filter_is_empty
  - contains_over_first_not_nil
  - empty_collection_literal
  - empty_string
  - explicit_init
  - fallthrough
  - first_where
  - flatmap_over_map_reduce
  - identical_operands
  - implicitly_unwrapped_optional
  - joined_default_parameter
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - lower_acl_than_parent
  - modifier_order
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_zero_over_explicit_init
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - redundant_type_annotation
  - sorted_first_last
  - toggle_bool
  - unavailable_function
  - unneeded_parentheses_in_closure_argument
  - unowned_variable_capture
  - vertical_parameter_alignment_on_call
  - yoda_condition

# --- Rule configuration -------------------------------------------------------
line_length:
  warning: 120
  error: 200
  ignores_urls: true
  ignores_comments: false
  ignores_function_declarations: false

file_length:
  warning: 600
  error: 1200

type_name:
  min_length: 3
  max_length:
    warning: 50
    error: 60

identifier_name:
  min_length:
    warning: 2
    error: 1
  # Geometry and math shorthand that reads fine in context.
  allowed_symbols: ["_"]
  excluded:
    - x
    - y
    - t
    - id
    - up
    - dx
    - dy

nesting:
  type_level:
    warning: 2

large_tuple:
  warning: 3
  error: 4

trailing_comma:
  mandatory_comma: false

# `body` and other SwiftUI computed properties routinely exceed the default 20.
closure_body_length:
  warning: 60
  error: 120

# Reports as warnings only; we never want a lint nit to fail a Release build.
reporter: "xcode"
